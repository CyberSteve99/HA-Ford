# more configuration options here: https://github.com/esphome/firmware/tree/main/bluetooth-proxy
# https://github.com/loopDelicious/home-automation/blob/main/bluetooth_proxy/esp32-c3.yml
# https://www.youtube.com/watch?v=pFXalO-JLHU&t=370s

substitutions:
  name: jbd-bms-ble
  device_description: "Monitor and control a Xiaoxiang Battery Management System (JBD-BMS) via BLE"
  external_components_source: github://syssi/esphome-jbd-bms@main

esphome:
  name: esp32-bluetooth-proxy
  friendly_name: Bluetooth Proxy
  min_version: 2026.8.2
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

packages:
  # Individual time estimation packages from remote repository
  remaining_charging_time:
    url: https://github.com/syssi/esphome-jbd-bms
    files:
      - path: packages/remaining_charging_time.yaml
        vars:
          sensor_id: bms0_remaining_charging_time
          sensor_name: "remaining charging time"
          current_sensor_id: bms0_average_current
          capacity_remaining_id: bms0_capacity_remaining
          nominal_capacity_id: bms0_nominal_capacity
  remaining_discharging_time:
    url: https://github.com/syssi/esphome-jbd-bms
    files:
      - path: packages/remaining_discharging_time.yaml
        vars:
          sensor_id: bms0_remaining_discharging_time
          sensor_name: "remaining discharging time"
          current_sensor_id: bms0_average_current
          capacity_remaining_id: bms0_capacity_remaining

logger:
  level: INFO

api:

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret van_wifi_ssid
    password: !secret van_wifi_password

ota:
  platform: esphome
  id: ota_esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

esp32_ble:
  max_connections: 4

# Modified tracker to hook into your BLE clients
esp32_ble_tracker:
  scan_parameters:
    active: true

# Keeps your native HA Docker Bluetooth connections active
bluetooth_proxy:
  active: true

ble_client:
  - id: client0
    mac_address: !secret fogstar_mac_address

jbd_bms_ble:
  - id: bms0
    ble_client_id: client0
    # Some Liontron BMS models require an update interval of less than 8s
    update_interval: 60s #4s
    # Default password of the JBD-SP04S034 V1.3 which requires authentication
    password: "XXXXXX"      # Your Fogstar Battery Bluetooth PIN

button:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    retrieve_hardware_version:
      name: "retrieve hardware version"
    retrieve_error_counts:
      name: "retrieve error counts"
    automatic_balancing:
      name: "automatic balancing"
    clear_alarm:
      name: "clear alarm"

  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

binary_sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    online_status:
      name: "online status"
    cell_overvoltage_protection:
      name: "cell overvoltage protection"
    cell_undervoltage_protection:
      name: "cell undervoltage protection"
    pack_overvoltage_protection:
      name: "pack overvoltage protection"
    pack_undervoltage_protection:
      name: "pack undervoltage protection"
    charge_overtemperature_protection:
      name: "charge overtemperature protection"
    charge_undertemperature_protection:
      name: "charge undertemperature protection"
    discharge_overtemperature_protection:
      name: "discharge overtemperature protection"
    discharge_undertemperature_protection:
      name: "discharge undertemperature protection"
    charge_overcurrent_protection:
      name: "charge overcurrent protection"
    discharge_overcurrent_protection:
      name: "discharge overcurrent protection"
    short_circuit_protection:
      name: "short circuit protection"
    ic_frontend_error:
      name: "ic frontend error"
    mosfet_software_lock:
      name: "mosfet software lock"

sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    cell_count:
      name: "battery strings"
    current:
      name: "current"
      id: bms0_current
    power:
      name: "power"
    charging_power:
      name: "charging power"
    discharging_power:
      name: "discharging power"
    state_of_charge:
      name: "state of charge"
    nominal_capacity:
      name: "nominal capacity"
      id: bms0_nominal_capacity
    charging_cycles:
      name: "charging cycles"
    capacity_remaining:
      name: "capacity remaining"
      id: bms0_capacity_remaining
    total_voltage:
      name: "total voltage"
    average_cell_voltage:
      name: "average cell voltage"
    delta_cell_voltage:
      name: "delta cell voltage"
    min_cell_voltage:
      name: "min cell voltage"
    max_cell_voltage:
      name: "max cell voltage"
    min_voltage_cell:
      name: "min voltage cell"
    max_voltage_cell:
      name: "max voltage cell"
    temperature_1:
      name: "temperature 1"
    temperature_2:
      name: "temperature 2"
    temperature_3:
      name: "temperature 3"
    #temperature_4:
    #  name: "temperature 4"
    cell_voltage_1:
      name: "cell voltage 1"
    cell_voltage_2:
      name: "cell voltage 2"
    cell_voltage_3:
      name: "cell voltage 3"
    cell_voltage_4:
      name: "cell voltage 4"
    operation_status_bitmask:
      name: "operation status bitmask"
    errors_bitmask:
      name: "errors bitmask"
    balancer_status_bitmask:
      name: "balancer status bitmask"
    software_version:
      name: "software version"
    
  # Average current sensor with exponential filtering
  - platform: copy
    source_id: bms0_current
    name: "average current"
    id: bms0_average_current
    filters:
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1

switch:
  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0

  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    charging:
      name: "charging"
    discharging:
      name: "discharging"

  - platform: restart
    name: "Restart ESP32 irremote"
    id: restart_esp_irremote

text_sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    errors:
      name: "errors"
    operation_status:
      name: "operation status"
    balancing_cells:
      name: "balancing cells"

time:
  - platform: sntp
    on_time:
      # Every 60 minutes
      - seconds: 0
        minutes: /60
        then:
          - switch.toggle: restart_esp_irremote%
